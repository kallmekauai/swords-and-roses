  <!-- Long dark braids and curls -->
  <rect x="9" y="13" width="30" height="39" fill="#26191e"/>
  <rect x="6" y="21" width="8" height="33" fill="#352024"/>
  <rect x="34" y="21" width="8" height="33" fill="#352024"/>

  <!-- Caramel highlights -->
  <rect x="9" y="25" width="3" height="25" fill="#a8754b"/>
  <rect x="36" y="22" width="3" height="28" fill="#a8754b"/>
  <rect x="14" y="13" width="3" height="9" fill="#8f603f"/>

  <!-- Full blush pink skirt -->
  <rect x="15" y="34" width="18" height="8" fill="#e9a0b7"/>
  <rect x="11" y="41" width="26" height="8" fill="#f2b5c8"/>
  <rect x="7" y="49" width="34" height="9" fill="#e9a0b7"/>
  <rect x="5" y="57" width="38" height="5" fill="#f4c1d0"/>

  <!-- Dress folds -->
  <rect x="12" y="47" width="3" height="13" fill="#d987a5"/>
  <rect x="23" y="42" width="3" height="18" fill="#ffe1e9"/>
  <rect x="34" y="47" width="3" height="13" fill="#d987a5"/>

  <!-- Gold dress trim -->
  <rect x="6" y="60" width="36" height="2" fill="#e8c36f"/>
  <rect x="16" y="36" width="16" height="2" fill="#e8c36f"/>

  <!-- Arms -->
  <rect x="10" y="31" width="5" height="12" fill="#a96d4d"/>
  <rect x="33" y="31" width="5" height="12" fill="#a96d4d"/>

  <!-- Pink puff sleeves -->
  <rect x="8" y="29" width="9" height="8" fill="#f5c0d0"/>
  <rect x="31" y="29" width="9" height="8" fill="#f5c0d0"/>
  <rect x="9" y="30" width="7" height="2" fill="#ffe1e9"/>
  <rect x="32" y="30" width="7" height="2" fill="#ffe1e9"/>

  <!-- Dress bodice -->
  <rect x="17" y="29" width="14" height="12" fill="#f5b4c7"/>
  <rect x="22" y="30" width="4" height="10" fill="#ffe0e8"/>

  <!-- Neck -->
