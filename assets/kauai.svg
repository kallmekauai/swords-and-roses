  <!-- Face -->
  <rect x="15" y="12" width="18" height="17" fill="#b47a57"/>
  <rect x="17" y="25" width="14" height="4" fill="#a96d4d"/>

  <!-- Brown eyes -->
  <rect x="18" y="19" width="4" height="3" fill="#fff0e5"/>
  <rect x="27" y="19" width="4" height="3" fill="#fff0e5"/>
  <rect x="19" y="19" width="2" height="3" fill="#573827"/>
  <rect x="28" y="19" width="2" height="3" fill="#573827"/>

  <!-- Eyelashes -->
  <rect x="17" y="18" width="5" height="1" fill="#24191c"/>
  <rect x="27" y="18" width="5" height="1" fill="#24191c"/>

  <!-- Soft pink lips -->
  <rect x="22" y="25" width="6" height="2" fill="#c8757d"/>

  <!-- Hair framing face -->
  <rect x="12" y="11" width="5" height="20" fill="#26191e"/>
  <rect x="32" y="11" width="5" height="20" fill="#26191e"/>
  <rect x="14" y="9" width="21" height="6" fill="#26191e"/>

  <!-- Braided highlights -->
  <rect x="12" y="17" width="2" height="5" fill="#a8754b"/>
  <rect x="34" y="22" width="2" height="6" fill="#a8754b"/>
  <rect x="10" y="34" width="2" height="5" fill="#a8754b"/>

  <!-- Golden tiara -->
  <rect x="16" y="8" width="17" height="3" fill="#e8c36f"/>
  <rect x="19" y="5" width="3" height="5" fill="#e8c36f"/>
  <rect x="24" y="3" width="4" height="7" fill="#e8c36f"/>
  <rect x="30" y="6" width="3" height="4" fill="#e8c36f"/>

  <!-- Pink crown gems -->
  <rect x="25" y="5" width="2" height="3" fill="#e87b9e"/>
  <rect x="20" y="7" width="2" height="2" fill="#e87b9e"/>
  <rect x="30" y="7" width="2" height="2" fill="#e87b9e"/>

  <!-- Necklace -->
  <rect x="22" y="30" width="5" height="1" fill="#e8c36f"/>
