<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Of Swords & Roses</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div id="game" aria-label="Medieval game world">
      <header class="game-header">
        <div class="game-heading">
          <h1>Of Swords & Roses</h1>
          <p>A Quest for Ever After</p>
        </div>
        <p id="instructions">Move with arrow keys or WASD. Press E to interact.</p>
      </header>
      <p id="message" role="status">Find the fallen star.</p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="assets/omar-animations.js"></script>
  <script src="assets/academy-map.js"></script>
  <script src="assets/isometric-courtyard.js"></script>
  <script src="game.js"></script>

<div id="dialogue-box" class="dialogue-box hidden">
  <div id="speaker-name">Princess Kauai</div>
  <p id="dialogue-text"></p>
  <span class="dialogue-hint">Press E to continue ▸</span>
</div>

</body>
</html>
